<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FloodAI · Đăng nhập</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Noto+Serif+JP:wght@300;400;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f1eb;--card:#ffffff;--border:#e2dbd2;
  --primary:#7a9e7e;--primary-d:#5e8063;
  --tx:#2a2520;--tx2:#5a544e;--tx3:#98928a;
  --danger:#d9604a;--shadow:rgba(0,0,0,0.08);
  --font-serif:"Noto Serif JP",serif;--font-sans:"DM Sans",sans-serif;--radius:16px;
}
[data-theme="dark"]{
  --bg:#151310;--card:#221f1b;--border:#302c27;
  --primary:#8aac8e;--primary-d:#6d9272;
  --tx:#e8e0d5;--tx2:#9e9488;--tx3:#5e5850;
  --danger:#e07060;--shadow:rgba(0,0,0,0.35);
}
body{font-family:var(--font-sans);background:var(--bg);color:var(--tx);
  min-height:100vh;display:flex;align-items:center;justify-content:center;font-size:14px}
.login-wrap{width:100%;max-width:380px;padding:24px}
.login-logo{text-align:center;margin-bottom:32px}
.login-logo-icon{
  width:52px;height:52px;background:var(--primary);border-radius:14px;
  display:inline-flex;align-items:center;justify-content:center;margin-bottom:12px
}
.login-logo-icon svg{width:32px;height:32px}
.login-title{font-family:var(--font-serif);font-size:24px;font-weight:600;color:var(--tx)}
.login-sub{font-size:13px;color:var(--tx3);margin-top:4px}
.login-card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:28px;box-shadow:0 4px 24px var(--shadow)
}
.form-group{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.form-label{font-size:12px;font-weight:600;color:var(--tx2);text-transform:uppercase;letter-spacing:0.05em}
.form-input{
  padding:10px 14px;border:1px solid var(--border);border-radius:10px;
  background:var(--bg);color:var(--tx);font-family:var(--font-sans);font-size:14px;
  outline:none;transition:border-color .2s;width:100%
}
.form-input:focus{border-color:var(--primary)}
.btn-login{
  width:100%;padding:11px;border-radius:10px;border:none;cursor:pointer;
  background:var(--primary);color:#fff;font-family:var(--font-sans);
  font-size:14px;font-weight:600;transition:opacity .2s,transform .2s;margin-top:4px
}
.btn-login:hover{opacity:.88;transform:translateY(-1px)}
.error-msg{
  background:rgba(224,112,96,0.12);border:1px solid var(--danger);
  border-radius:9px;padding:10px 14px;font-size:13px;color:var(--danger);margin-bottom:16px
}
.live-link{
  text-align:center;margin-top:20px;font-size:13px;color:var(--tx3)
}
.live-link a{color:var(--primary);text-decoration:none;font-weight:500}
.live-link a:hover{text-decoration:underline}
.divider{border:none;border-top:1px solid var(--border);margin:20px 0}
</style>
</head>
<body>
<div class="login-wrap">
  <div class="login-logo">
    <div class="login-logo-icon">
      <svg viewBox="0 0 22 22" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M2 13 C5 10.5, 8 15.5, 11 13 C14 10.5, 17 15.5, 20 13"
              stroke="white" stroke-width="1.8" stroke-linecap="round" fill="none"/>
        <path d="M2 17 C5 14.5, 8 19.5, 11 17 C14 14.5, 17 19.5, 20 17"
              stroke="rgba(255,255,255,0.5)" stroke-width="1.3" stroke-linecap="round" fill="none"/>
      </svg>
    </div>
    <div class="login-title">FloodAI</div>
    <div class="login-sub">Hệ thống phân tích lũ lụt</div>
  </div>

  <div class="login-card">
    {% if error %}
    <div class="error-msg">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/login">
      <div class="form-group">
        <label class="form-label" for="username">Tên đăng nhập</label>
        <input class="form-input" type="text" id="username" name="username"
               placeholder="admin" autocomplete="username" required autofocus>
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Mật khẩu</label>
        <input class="form-input" type="password" id="password" name="password"
               placeholder="••••••" autocomplete="current-password" required>
      </div>
      <button class="btn-login" type="submit">Đăng nhập</button>
    </form>

    <hr class="divider">
    <div class="live-link">
      Không có tài khoản?
      <a href="/live">Dùng Live Model công khai →</a>
    </div>
  </div>
</div>
<script>
  const saved = localStorage.getItem('theme') || 'dark';
  document.documentElement.setAttribute('data-theme', saved);
</script>
</body>
</html>
