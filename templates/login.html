<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Đăng nhập — FloodNews</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://js.hcaptcha.com/1/api.js" async defer></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#0c2340;--blue:#1565c0;--card:#fff;--border:rgba(0,0,0,.1);
  --tx:#1a1a1a;--tx2:#4a4a4a;--tx3:#888;--warn:#dc2626;--green:#16a34a;
  --font:'Source Sans 3',system-ui,sans-serif;--font-serif:'Merriweather',serif;
  --radius:10px;--shadow:0 4px 24px rgba(0,0,0,.12)}
body{font-family:var(--font);background:linear-gradient(135deg,#0c2340 0%,#1e4976 100%);
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}

.card{background:var(--card);border-radius:16px;padding:36px 32px;
  width:100%;max-width:400px;box-shadow:var(--shadow)}

/* Logo */
.logo{display:flex;align-items:center;gap:10px;margin-bottom:24px;justify-content:center}
.logo-mark{width:42px;height:42px;background:var(--navy);border-radius:10px;
  display:flex;align-items:center;justify-content:center}
.logo-mark svg{width:26px;height:26px}
.logo-name{font-family:var(--font-serif);font-size:20px;font-weight:700;color:var(--navy)}

/* Tabs */
.tabs{display:flex;background:#f3f3ef;border-radius:var(--radius);padding:3px;margin-bottom:24px}
.tab{flex:1;padding:8px;text-align:center;border:none;background:none;
  font-family:var(--font);font-size:14px;font-weight:500;color:var(--tx3);
  border-radius:8px;cursor:pointer;transition:all .15s}
.tab.active{background:#fff;color:var(--navy);box-shadow:0 1px 4px rgba(0,0,0,.1)}

/* Form */
.form-group{margin-bottom:14px}
.form-label{display:block;font-size:11px;font-weight:600;color:var(--tx2);
  text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px}
.form-input{width:100%;padding:10px 13px;border:1.5px solid var(--border);
  border-radius:var(--radius);font-family:var(--font);font-size:14px;
  color:var(--tx);transition:border-color .15s;background:#fafaf7}
.form-input:focus{outline:none;border-color:var(--blue);background:#fff}
.form-input::placeholder{color:var(--tx3)}
select.form-input{cursor:pointer}

/* OTP input */
.otp-group{display:flex;gap:8px;justify-content:center;margin:16px 0}
.otp-digit{width:44px;height:50px;border:1.5px solid var(--border);border-radius:var(--radius);
  text-align:center;font-size:22px;font-weight:700;font-family:var(--font);
  color:var(--navy);background:#fafaf7;transition:border-color .15s}
.otp-digit:focus{outline:none;border-color:var(--blue);background:#fff}

/* Buttons */
.btn-main{width:100%;padding:12px;background:var(--navy);color:#fff;border:none;
  border-radius:var(--radius);font-family:var(--font);font-size:15px;
  font-weight:600;cursor:pointer;transition:background .15s;margin-top:4px;
  display:flex;align-items:center;justify-content:center;gap:8px}
.btn-main:hover{background:#1e3a5f}
.btn-main:disabled{opacity:.5;cursor:not-allowed}

/* Alerts */
.alert{padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:14px;display:none}
.alert.show{display:block}
.alert-error{background:#fee2e2;border:1px solid #fca5a5;color:#991b1b}
.alert-success{background:#dcfce7;border:1px solid #86efac;color:#14532d}
.alert-info{background:#dbeafe;border:1px solid #93c5fd;color:#1e3a8a}

.back-link{text-align:center;margin-top:20px;font-size:13px;color:var(--tx3)}
.back-link a{color:var(--blue);text-decoration:none;font-weight:500}
.step-label{font-size:12px;color:var(--tx3);text-align:center;margin-bottom:16px}
.resend{font-size:12px;text-align:center;margin-top:10px;color:var(--tx3)}
.resend button{background:none;border:none;color:var(--blue);cursor:pointer;font-size:12px;font-weight:500}

.h-captcha{display:flex;justify-content:center;margin:12px 0}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-mark">
      <svg viewBox="0 0 22 22" fill="none">
        <path d="M3 14c1.5-2 3-3 5-3s3.5 2 5 2 3.5-2 5-3" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
        <path d="M3 18c1.5-2 3-3 5-3s3.5 2 5 2 3.5-2 5-3" stroke="#4da3ff" stroke-width="2.2" stroke-linecap="round"/>
        <path d="M11 4v6M8.5 6.5l2.5-2.5 2.5 2.5" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <span class="logo-name">FloodNews</span>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab active" id="tab-login" onclick="switchTab('login')">Đăng nhập</button>
    <button class="tab" id="tab-register" onclick="switchTab('register')">Đăng ký</button>
  </div>

  <!-- Alert chung -->
  <div class="alert alert-error" id="alert-error"></div>
  <div class="alert alert-success" id="alert-success"></div>
  <div class="alert alert-info" id="alert-info"></div>

  <!-- ── ĐĂNG NHẬP ── -->
  <div id="pane-login">
    <div class="form-group">
      <label class="form-label">Email</label>
      <input type="email" id="login-email" class="form-input" placeholder="email@domain.com">
    </div>
    <div class="form-group">
      <label class="form-label">Mật khẩu</label>
      <input type="password" id="login-pass" class="form-input" placeholder="••••••••"
        onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <div class="h-captcha" data-sitekey="{{ hcaptcha_site_key }}" id="hcap-login"></div>
    <button class="btn-main" id="btn-login" onclick="doLogin()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
      Đăng nhập
    </button>
  </div>

  <!-- ── ĐĂNG KÝ — BƯỚC 1: thông tin ── -->
  <div id="pane-register" style="display:none">
    <div class="form-group">
      <label class="form-label">Họ tên</label>
      <input type="text" id="reg-name" class="form-input" placeholder="Nguyễn Văn A">
    </div>
    <div class="form-group">
      <label class="form-label">Email</label>
      <input type="email" id="reg-email" class="form-input" placeholder="email@domain.com">
    </div>
    <div class="form-group">
      <label class="form-label">Mật khẩu</label>
      <input type="password" id="reg-pass" class="form-input" placeholder="Tối thiểu 6 ký tự">
    </div>
    <div class="h-captcha" data-sitekey="{{ hcaptcha_site_key }}" id="hcap-register"></div>
    <button class="btn-main" id="btn-send-otp" onclick="doSendOtp()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
      Gửi mã xác nhận về email
    </button>
  </div>

  <!-- ── ĐĂNG KÝ — BƯỚC 2: nhập OTP ── -->
  <div id="pane-otp" style="display:none">
    <p class="step-label">Nhập mã 6 số đã gửi đến<br><strong id="otp-email-label"></strong></p>
    <div class="otp-group">
      <input class="otp-digit" maxlength="1" id="d0" oninput="otpInput(0)" onkeydown="otpKey(event,0)">
      <input class="otp-digit" maxlength="1" id="d1" oninput="otpInput(1)" onkeydown="otpKey(event,1)">
      <input class="otp-digit" maxlength="1" id="d2" oninput="otpInput(2)" onkeydown="otpKey(event,2)">
      <input class="otp-digit" maxlength="1" id="d3" oninput="otpInput(3)" onkeydown="otpKey(event,3)">
      <input class="otp-digit" maxlength="1" id="d4" oninput="otpInput(4)" onkeydown="otpKey(event,4)">
      <input class="otp-digit" maxlength="1" id="d5" oninput="otpInput(5)" onkeydown="otpKey(event,5)">
    </div>
    <button class="btn-main" id="btn-verify" onclick="doVerifyOtp()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>
      Xác nhận
    </button>
    <div class="resend">
      Không nhận được mã?
      <button onclick="doResendOtp()" id="btn-resend">Gửi lại</button>
    </div>
  </div>

  <div class="back-link"><a href="/">← Trở về trang chủ</a></div>
</div>

<script>
var SITE_KEY = "{{ hcaptcha_site_key }}";
var currentTab = 'login';
var regEmail = '';

// ── Tab switch ─────────────────────────────────────
function switchTab(tab) {
  currentTab = tab;
  document.getElementById('tab-login').classList.toggle('active', tab==='login');
  document.getElementById('tab-register').classList.toggle('active', tab==='register');
  document.getElementById('pane-login').style.display    = tab==='login'    ? '' : 'none';
  document.getElementById('pane-register').style.display = tab==='register' ? '' : 'none';
  document.getElementById('pane-otp').style.display      = 'none';
  clearAlerts();
}

// ── Alerts ─────────────────────────────────────────
function showAlert(type, msg) {
  clearAlerts();
  var el = document.getElementById('alert-' + type);
  el.textContent = msg;
  el.classList.add('show');
}
function clearAlerts() {
  ['error','success','info'].forEach(function(t){
    document.getElementById('alert-'+t).classList.remove('show');
  });
}

// ── Get hCaptcha token ──────────────────────────────
function getCaptchaToken(id) {
  if (globalThis.hcaptcha) {
    var el = document.getElementById(id);
    var widgetId = el ? el.dataset.hcaptchaWidgetId : undefined;
    return hcaptcha.getResponse(widgetId) || '';
  }
  return '';
}

// ── ĐĂNG NHẬP ──────────────────────────────────────
async function doLogin() {
  var email = document.getElementById('login-email').value.trim();
  var pass  = document.getElementById('login-pass').value;
  var token = getCaptchaToken('hcap-login');

  if (!email || !pass) { showAlert('error','Vui lòng nhập đầy đủ email và mật khẩu'); return; }
  if (!token)          { showAlert('error','Vui lòng xác minh CAPTCHA'); return; }

  var btn = document.getElementById('btn-login');
  btn.disabled = true; btn.textContent = 'Đang xử lý...';

  try {
    var res  = await fetch('/api/auth/login', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ email, password: pass, hcaptcha_token: token })
    });
    var data = await res.json();
    if (!res.ok) {
      showAlert('error', data.error || 'Đăng nhập thất bại');
      if (window.hcaptcha) hcaptcha.reset();
    } else {
      showAlert('success', 'Đăng nhập thành công! Đang chuyển hướng...');
      setTimeout(function(){ window.location.href = '/admin'; }, 800);
    }
  } catch(e) {
    showAlert('error', 'Lỗi kết nối — thử lại sau');
  } finally {
    btn.disabled = false; btn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg> Đăng nhập';
  }
}

// ── ĐĂNG KÝ — Gửi OTP ──────────────────────────────
async function doSendOtp() {
  var name  = document.getElementById('reg-name').value.trim();
  var email = document.getElementById('reg-email').value.trim();
  var pass  = document.getElementById('reg-pass').value;
  var token = getCaptchaToken('hcap-register');

  if (!name || !email || !pass) { showAlert('error','Vui lòng điền đầy đủ thông tin'); return; }
  if (pass.length < 6)          { showAlert('error','Mật khẩu tối thiểu 6 ký tự'); return; }
  if (!token)                   { showAlert('error','Vui lòng xác minh CAPTCHA'); return; }

  var btn = document.getElementById('btn-send-otp');
  btn.disabled = true; btn.textContent = 'Đang gửi...';

  try {
    var res  = await fetch('/api/auth/send-otp', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ name, email, password: pass, hcaptcha_token: token })
    });
    var data = await res.json();
    if (!res.ok) {
      showAlert('error', data.error || 'Gửi mã thất bại');
      if (window.hcaptcha) hcaptcha.reset();
    } else {
      regEmail = email;
      document.getElementById('otp-email-label').textContent = email;
      document.getElementById('pane-register').style.display = 'none';
      document.getElementById('pane-otp').style.display      = '';
      showAlert('info', 'Đã gửi mã xác nhận về ' + email + '. Kiểm tra hộp thư (kể cả Spam).');
      setTimeout(function(){ document.getElementById('d0').focus(); }, 100);
    }
  } catch(e) {
    showAlert('error', 'Lỗi kết nối — thử lại sau');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg> Gửi mã xác nhận về email';
  }
}

// ── OTP input UX ────────────────────────────────────
function otpInput(i) {
  var v = document.getElementById('d'+i).value.replace(/\D/,'');
  document.getElementById('d'+i).value = v;
  if (v && i < 5) document.getElementById('d'+(i+1)).focus();
  if (i === 5 && v) doVerifyOtp();
}
function otpKey(e, i) {
  if (e.key==='Backspace' && !document.getElementById('d'+i).value && i > 0)
    document.getElementById('d'+(i-1)).focus();
}
function getOtpCode() {
  return [0,1,2,3,4,5].map(function(i){ return document.getElementById('d'+i).value; }).join('');
}

// ── ĐĂNG KÝ — Xác nhận OTP ──────────────────────────
async function doVerifyOtp() {
  var code = getOtpCode();
  if (code.length < 6) { showAlert('error','Vui lòng nhập đủ 6 số'); return; }

  var btn = document.getElementById('btn-verify');
  btn.disabled = true; btn.textContent = 'Đang xác nhận...';

  try {
    var res  = await fetch('/api/auth/verify-otp', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ email: regEmail, code })
    });
    var data = await res.json();
    if (!res.ok) {
      showAlert('error', data.error || 'Mã không đúng');
      [0,1,2,3,4,5].forEach(function(i){ document.getElementById('d'+i).value=''; });
      document.getElementById('d0').focus();
    } else {
      showAlert('success', '✓ Xác nhận thành công! Tài khoản đang chờ admin phê duyệt.');
      document.getElementById('pane-otp').style.display = 'none';
    }
  } catch(e) {
    showAlert('error', 'Lỗi kết nối — thử lại sau');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg> Xác nhận';
  }
}

// ── Gửi lại OTP ────────────────────────────────────
async function doResendOtp() {
  var btn = document.getElementById('btn-resend');
  btn.disabled = true; btn.textContent = 'Đang gửi...';
  try {
    await fetch('/api/auth/send-otp', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ email: regEmail })
    });
    showAlert('info', 'Đã gửi lại mã mới về ' + regEmail);
    [0,1,2,3,4,5].forEach(function(i){ document.getElementById('d'+i).value=''; });
    document.getElementById('d0').focus();
  } catch(e) {}
  setTimeout(function(){ btn.disabled=false; btn.textContent='Gửi lại'; }, 60000);
  btn.textContent = 'Gửi lại sau 60s';
}
</script>
</body>
</html>
