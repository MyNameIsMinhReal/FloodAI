<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Đăng nhập — FloodNews</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#0c2340;--blue:#1565c0;--card:#fff;--border:rgba(0,0,0,.1);
  --tx:#1a1a1a;--tx2:#4a4a4a;--tx3:#888;--warn:#dc2626;
  --font:'Source Sans 3',system-ui,sans-serif;--font-serif:'Merriweather',serif;
  --radius-md:10px;--shadow:0 4px 24px rgba(0,0,0,.1)}
body{font-family:var(--font);background:linear-gradient(135deg,#0c2340 0%,#1e4976 100%);
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{background:var(--card);border-radius:16px;padding:36px 32px;
  width:100%;max-width:380px;box-shadow:var(--shadow)}
.login-logo{display:flex;align-items:center;gap:10px;margin-bottom:28px;justify-content:center}
.logo-mark{width:42px;height:42px;background:var(--navy);border-radius:10px;
  display:flex;align-items:center;justify-content:center}
.logo-mark svg{width:26px;height:26px}
.logo-name{font-family:var(--font-serif);font-size:20px;font-weight:700;color:var(--navy)}
.login-title{font-family:var(--font-serif);font-size:22px;font-weight:700;
  text-align:center;margin-bottom:6px;color:var(--tx)}
.login-sub{text-align:center;font-size:14px;color:var(--tx3);margin-bottom:28px}
.form-group{margin-bottom:16px}
.form-label{display:block;font-size:12px;font-weight:600;color:var(--tx2);
  text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.form-input{width:100%;padding:11px 14px;border:1.5px solid var(--border);
  border-radius:var(--radius-md);font-family:var(--font);font-size:15px;
  color:var(--tx);transition:border-color .15s;background:#fafaf7}
.form-input:focus{outline:none;border-color:var(--blue);background:#fff}
.form-input::placeholder{color:var(--tx3)}
.error-box{background:#fee2e2;border:1px solid #fca5a5;border-radius:8px;
  padding:10px 14px;font-size:13px;color:#991b1b;margin-bottom:16px;display:none}
.error-box.show{display:block}
.login-btn{width:100%;padding:12px;background:var(--navy);color:#fff;border:none;
  border-radius:var(--radius-md);font-family:var(--font);font-size:15px;
  font-weight:600;cursor:pointer;transition:background .15s;margin-top:8px}
.login-btn:hover{background:#1e3a5f}
.back-link{text-align:center;margin-top:20px;font-size:13px;color:var(--tx3)}
.back-link a{color:var(--blue);text-decoration:none;font-weight:500}
.back-link a:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="login-card">
  <div class="login-logo">
    <div class="logo-mark">
      <svg viewBox="0 0 22 22" fill="none">
        <path d="M3 14c1.5-2 3-3 5-3s3.5 2 5 2 3.5-2 5-3" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
        <path d="M3 18c1.5-2 3-3 5-3s3.5 2 5 2 3.5-2 5-3" stroke="#4da3ff" stroke-width="2.2" stroke-linecap="round"/>
        <path d="M11 4v6M8.5 6.5l2.5-2.5 2.5 2.5" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <span class="logo-name">FloodNews</span>
  </div>
  <h1 class="login-title">Đăng nhập quản trị</h1>
  <p class="login-sub">Dành cho quản trị viên hệ thống</p>
  {% if error %}
  <div class="error-box show">{{ error }}</div>
  {% endif %}
  <form method="POST" action="/login">
    <div class="form-group">
      <label class="form-label">Tên đăng nhập</label>
      <input type="text" name="username" class="form-input" placeholder="admin" required autofocus>
    </div>
    <div class="form-group">
      <label class="form-label">Mật khẩu</label>
      <input type="password" name="password" class="form-input" placeholder="••••••••" required>
    </div>
    <button type="submit" class="login-btn">Đăng nhập</button>
  </form>
  <div class="back-link"><a href="/">← Trở về trang chủ</a></div>
</div>
</body>
</html>
