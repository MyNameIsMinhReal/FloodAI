<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FloodAI · Đăng nhập</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Serif+JP:wght@300;400;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

body{font-family:'Inter',system-ui,sans-serif;height:100vh;overflow:hidden;-webkit-font-smoothing:antialiased}

/* ── Scene ──────────────────────────────────────────────── */
#scene{position:fixed;inset:0;overflow:hidden}

/* ── Sky ────────────────────────────────────────────────── */
.sky{position:absolute;inset:0;transition:opacity 2.4s ease}
.sky-day{
  opacity:1;
  background:linear-gradient(to bottom,
    #1e7ab8 0%,#3aa0d8 18%,#72c8eb 42%,
    #b4dff2 60%,#ffe8a8 76%,#f5b870 88%,#e87040 100%);
}
.sky-night{
  opacity:0;
  background:linear-gradient(to bottom,
    #050e22 0%,#081830 18%,#0d2248 40%,
    #102a5a 62%,#163268 78%,#1a386e 90%,#0e2248 100%);
}
body.night .sky-day{opacity:0}
body.night .sky-night{opacity:1}

/* ── Stars ──────────────────────────────────────────────── */
#stars{position:absolute;inset:0 0 42% 0;opacity:0;pointer-events:none;transition:opacity 1.6s ease .6s}
body.night #stars{opacity:1}
.star{
  position:absolute;background:#fff;border-radius:50%;
  animation:twinkle var(--dur,3s) ease-in-out infinite var(--delay,0s);
}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.8)}50%{opacity:1;transform:scale(1.3)}}

/* ── Sun ────────────────────────────────────────────────── */
.sun-wrap{
  position:absolute;left:62%;top:16%;transform:translate(-50%,0);
  transition:transform 2.2s cubic-bezier(.4,0,.2,1),opacity 2s ease;
}
body.night .sun-wrap{transform:translate(-50%,280px);opacity:0}
.sun-rays{
  position:absolute;inset:-42px;border-radius:50%;
  background:repeating-conic-gradient(rgba(255,210,50,.10) 0deg 11deg,transparent 11deg 22deg);
  animation:spin-slow 32s linear infinite;z-index:1;
}
@keyframes spin-slow{to{transform:rotate(360deg)}}
.sun{
  position:relative;z-index:2;width:76px;height:76px;border-radius:50%;
  background:radial-gradient(circle at 38% 32%,#fff9c4 0%,#ffe033 30%,#ffb820 65%,#ff8800 100%);
  box-shadow:0 0 0 10px rgba(255,220,50,.14),0 0 28px 10px rgba(255,200,30,.55),0 0 70px 24px rgba(255,140,20,.30),0 0 130px 50px rgba(255,90,0,.14);
  animation:sun-pulse 4.5s ease-in-out infinite;
}
@keyframes sun-pulse{
  0%,100%{box-shadow:0 0 0 10px rgba(255,220,50,.14),0 0 28px 10px rgba(255,200,30,.55),0 0 70px 24px rgba(255,140,20,.30),0 0 130px 50px rgba(255,90,0,.14)}
  50%{box-shadow:0 0 0 15px rgba(255,225,60,.20),0 0 38px 14px rgba(255,210,50,.65),0 0 90px 32px rgba(255,155,30,.40),0 0 170px 60px rgba(255,110,0,.20)}
}

/* ── Moon ───────────────────────────────────────────────── */
.moon-wrap{
  position:absolute;right:18%;top:10%;transform:translate(50%,300px);opacity:0;
  transition:transform 2.2s cubic-bezier(.4,0,.2,1),opacity 2s ease .4s;
}
body.night .moon-wrap{transform:translate(50%,0);opacity:1}
.moon{
  width:80px;height:80px;border-radius:50%;
  background:radial-gradient(circle at 42% 40%,#ffffff 0%,#fffde8 55%,#f8f5c8 100%);
  box-shadow:0 0 0 5px rgba(255,253,210,.18),0 0 22px 8px rgba(255,250,190,.55),0 0 55px 22px rgba(240,230,170,.28),0 0 110px 45px rgba(200,190,140,.12);
  animation:moon-pulse 5.5s ease-in-out infinite;
}
@keyframes moon-pulse{
  0%,100%{box-shadow:0 0 0 5px rgba(255,253,210,.18),0 0 22px 8px rgba(255,250,190,.55),0 0 55px 22px rgba(240,230,170,.28),0 0 110px 45px rgba(200,190,140,.12)}
  50%{box-shadow:0 0 0 8px rgba(255,253,210,.25),0 0 32px 14px rgba(255,252,200,.70),0 0 75px 30px rgba(240,235,180,.38),0 0 140px 55px rgba(210,200,155,.18)}
}

/* ── Clouds ─────────────────────────────────────────────── */
.cloud-wrap{position:absolute;top:0;left:0;right:0;bottom:40%;pointer-events:none;overflow:hidden}
.cloud{position:absolute;transition:filter 2.2s ease,opacity 2.2s ease}
body.night .cloud{filter:brightness(.08) hue-rotate(220deg);opacity:.5}
.cloud-1{top:12%;animation:cloud-drift 38s linear infinite}
.cloud-2{top:22%;animation:cloud-drift 52s linear infinite;animation-delay:-22s}
.cloud-3{top:7%;animation:cloud-drift 44s linear infinite;animation-delay:-10s;opacity:.65}
.cloud-4{top:30%;animation:cloud-drift 60s linear infinite;animation-delay:-35s;opacity:.55}
@keyframes cloud-drift{from{left:-250px}to{left:110%}}

/* ── Ground ─────────────────────────────────────────────── */
.ground-svg{position:absolute;bottom:0;left:0;width:100%;height:38%}
.g-back  {fill:#6a9870;transition:fill 2.4s ease}
.g-mid   {fill:#3a6a30;transition:fill 2.4s ease}
.g-trees {fill:#1e3818;transition:fill 2.4s ease}
.g-water {fill:#4a7aaa;transition:fill 2.4s ease}
.g-front {fill:#12220c;transition:fill 2.4s ease}
.g-grass {fill:#0c1a08;transition:fill 2.4s ease}
body.night .g-back  {fill:#0c1e2a}
body.night .g-mid   {fill:#081018}
body.night .g-trees {fill:#040c0a}
body.night .g-water {fill:#040e1e}
body.night .g-front {fill:#020508}
body.night .g-grass {fill:#010304}
.g-moon-refl{opacity:0;transition:opacity 2.4s ease}
body.night .g-moon-refl{opacity:1}
.g-sun-refl{opacity:1;transition:opacity 2.4s ease}
body.night .g-sun-refl{opacity:0}
.g-shimmer{stroke:rgba(255,255,255,.04);stroke-width:1;transition:stroke 2.4s ease}
body.night .g-shimmer{stroke:rgba(180,210,255,.06)}

/* ── Form wrap ──────────────────────────────────────────── */
.form-wrap{
  position:absolute;top:0;left:0;right:0;bottom:28%;
  display:flex;align-items:flex-end;justify-content:center;
  padding:20px 20px 2vh;z-index:10;
}

/* ── Card ───────────────────────────────────────────────── */
.form-card{
  width:100%;max-width:370px;
  background:rgba(255,255,255,.88);
  backdrop-filter:blur(28px) saturate(180%);
  -webkit-backdrop-filter:blur(28px) saturate(180%);
  border:1px solid rgba(255,255,255,.78);
  border-radius:24px;padding:6px;
  box-shadow:0 8px 40px rgba(0,0,0,.13),0 2px 8px rgba(0,0,0,.08);
  transition:background 2.2s,border-color 2.2s,box-shadow 2.2s;
}
body.night .form-card{
  background:rgba(8,6,28,.84);
  border-color:rgba(255,255,255,.09);
  box-shadow:0 8px 48px rgba(0,0,0,.62),0 2px 12px rgba(0,0,0,.40);
}

/* ── Tabs ───────────────────────────────────────────────── */
.tabs{
  display:flex;gap:3px;
  background:rgba(0,0,0,.055);
  border-radius:19px;padding:4px;
  transition:background 2.2s;
}
body.night .tabs{background:rgba(255,255,255,.07)}

.tab{
  flex:1;padding:9px 8px;border:none;border-radius:16px;
  cursor:pointer;font-family:'Inter',sans-serif;font-size:13px;font-weight:600;
  background:transparent;color:rgba(0,0,0,.36);
  transition:background .28s,color .28s,box-shadow .28s;
  display:flex;align-items:center;justify-content:center;gap:7px;
  letter-spacing:.01em;
}
body.night .tab{color:rgba(255,255,255,.32)}

.tab.active{
  background:#fff;color:#14142a;
  box-shadow:0 2px 10px rgba(0,0,0,.13);
}
body.night .tab.active{
  background:rgba(30,26,70,.95);
  color:#ffffff;
  box-shadow:0 2px 10px rgba(0,0,0,.40);
}
.tab svg{flex-shrink:0;transition:transform .28s}
.tab:hover:not(.active) svg{transform:scale(1.12)}
.tab:hover:not(.active){color:rgba(0,0,0,.6)}
body.night .tab:hover:not(.active){color:rgba(255,255,255,.6)}

/* ── Card inner ─────────────────────────────────────────── */
.card-inner{padding:16px 20px 20px}

/* ── Logo ───────────────────────────────────────────────── */
.form-logo{text-align:center;margin-bottom:14px}
.logo-icon{
  width:50px;height:50px;border-radius:13px;
  background:linear-gradient(135deg,#5ab3ff,#2d7ff9);
  display:inline-flex;align-items:center;justify-content:center;
  margin-bottom:10px;
  box-shadow:0 4px 16px rgba(45,127,249,.42);
  transition:box-shadow .3s;
}
body.night .logo-icon{box-shadow:0 4px 20px rgba(77,163,255,.50)}
.logo-icon svg{width:28px;height:28px}
.logo-title{
  font-family:'Noto Serif JP',serif;font-size:19px;font-weight:600;
  color:#14142a;transition:color 2.2s;letter-spacing:-.01em;
}
body.night .logo-title{color:rgba(255,255,255,.93)}
.logo-sub{font-size:11.5px;color:rgba(0,0,0,.38);margin-top:3px;transition:color 2.2s}
body.night .logo-sub{color:rgba(255,255,255,.38)}

/* ── Error ──────────────────────────────────────────────── */
.error-msg{
  background:rgba(200,40,30,.07);border:1px solid rgba(200,40,30,.20);
  border-radius:10px;padding:10px 13px;font-size:12.5px;color:#8a0808;
  margin-bottom:14px;display:flex;align-items:center;gap:8px;
  animation:err-in .3s cubic-bezier(.34,1.56,.64,1);
}
body.night .error-msg{background:rgba(255,59,48,.14);border-color:rgba(255,59,48,.30);color:#ff9090}
@keyframes err-in{from{opacity:0;transform:translateY(-6px) scale(.97)}to{opacity:1;transform:none}}
.error-msg svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;flex-shrink:0}

/* ── Form fields ────────────────────────────────────────── */
.form-group{margin-bottom:11px}
.form-label{
  display:block;font-size:10.5px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;color:rgba(0,0,0,.40);margin-bottom:5px;
  transition:color 2.2s;
}
body.night .form-label{color:rgba(255,255,255,.40)}

.input-wrap{position:relative}
.form-input{
  width:100%;padding:10px 14px;border-radius:11px;
  border:1.5px solid rgba(0,0,0,.10);
  background:rgba(255,255,255,.72);color:#14142a;
  font-family:'Inter',sans-serif;font-size:13.5px;outline:none;
  transition:border-color .2s,box-shadow .2s,background 2.2s,color 2.2s,border-color 2.2s;
}
body.night .form-input{background:rgba(16,14,46,.82);border-color:rgba(255,255,255,.13);color:#eeeeff}
.form-input::placeholder{color:rgba(0,0,0,.22)}
body.night .form-input::placeholder{color:rgba(255,255,255,.22)}
.form-input:focus{border-color:#4da3ff;box-shadow:0 0 0 3px rgba(77,163,255,.20)}
body.night .form-input:focus{border-color:#5ab3ff;box-shadow:0 0 0 3px rgba(90,179,255,.18)}
#password{padding-right:42px}

/* ── Password eye ───────────────────────────────────────── */
.pw-eye{
  position:absolute;right:11px;top:50%;transform:translateY(-50%);
  background:none;border:none;cursor:pointer;padding:4px;
  color:rgba(0,0,0,.28);transition:color .2s;
  display:flex;align-items:center;line-height:0;
}
body.night .pw-eye{color:rgba(255,255,255,.28)}
.pw-eye:hover{color:rgba(0,0,0,.62)}
body.night .pw-eye:hover{color:rgba(255,255,255,.62)}
.pw-eye svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ── Submit button ──────────────────────────────────────── */
.btn-submit{
  width:100%;padding:11px;border:none;border-radius:11px;cursor:pointer;
  font-family:'Inter',sans-serif;font-size:14px;font-weight:600;
  background:linear-gradient(135deg,#1565c0,#2d7ff9);color:#fff;
  box-shadow:0 4px 14px rgba(45,127,249,.38);margin-top:6px;
  transition:opacity .2s,transform .18s,box-shadow .2s;
  display:flex;align-items:center;justify-content:center;gap:8px;
  text-decoration:none;line-height:1.4;letter-spacing:.01em;
}
.btn-submit:hover{opacity:.92;transform:translateY(-1px);box-shadow:0 6px 20px rgba(45,127,249,.48)}
.btn-submit:active{transform:translateY(0);box-shadow:0 2px 8px rgba(45,127,249,.30);transition-duration:.08s}
.btn-submit.loading{opacity:.7;pointer-events:none}
.btn-submit svg{width:15px;height:15px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Divider ────────────────────────────────────────────── */
.divider{height:1px;background:rgba(0,0,0,.08);border:none;margin:13px 0;transition:background 2.2s}
body.night .divider{background:rgba(255,255,255,.08)}

/* ── Footer links ───────────────────────────────────────── */
.footer-links{
  text-align:center;font-size:12px;color:rgba(0,0,0,.36);
  display:flex;flex-direction:column;gap:5px;transition:color 2.2s;
}
body.night .footer-links{color:rgba(255,255,255,.34)}
.footer-links a{color:#2d7ff9;text-decoration:none;font-weight:500;transition:opacity .2s}
.footer-links a:hover{opacity:.75;text-decoration:underline}

/* ── Register panel ─────────────────────────────────────── */
.register-panel{text-align:center;padding:6px 4px 2px}
.reg-icon{
  font-size:44px;display:block;margin-bottom:13px;line-height:1;
  animation:float 3s ease-in-out infinite;
}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.reg-title{
  font-family:'Noto Serif JP',serif;font-size:16px;font-weight:600;
  color:rgba(255,255,255,.88);margin-bottom:8px;
}
.reg-sub{
  font-size:12px;color:rgba(255,255,255,.40);line-height:1.75;margin-bottom:20px;
}
.reg-sub strong{color:rgba(255,255,255,.65);font-weight:500}

/* ── Responsive ─────────────────────────────────────────── */
@media(max-height:620px){
  .form-wrap{bottom:26%}
  .ground-svg{height:26%}
  .card-inner{padding:12px 18px 16px}
  .form-logo{margin-bottom:10px}
}
@media(max-width:400px){
  .form-card{border-radius:20px}
}
</style>

  <!-- Form Card -->
  <div class="form-wrap">
    <div class="form-card">

      <!-- Tabs: Đăng nhập (ngày) / Đăng ký (đêm) -->

        <button class="tab active" id="tab-login" role="tab" aria-selected="true" onclick="setMode('day')">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
            <circle cx="12" cy="12" r="5"/>
            <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>

          </svg>
          Đăng nhập
        </button>
        <button class="tab" id="tab-register" role="tab" aria-selected="false" onclick="setMode('night')">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
            <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>

      <div class="card-inner" id="login-panel" role="tabpanel">
        <div class="form-logo">

              <path d="M2 13C5 10.5 8 15.5 11 13C14 10.5 17 15.5 20 13" stroke="white" stroke-width="2" stroke-linecap="round"/>
              <path d="M2 17C5 14.5 8 19.5 11 17C14 14.5 17 19.5 20 17" stroke="rgba(255,255,255,.55)" stroke-width="1.4" stroke-linecap="round"/>
            </svg>
          </div>
          <div class="logo-title">FloodAI</div>
          <div class="logo-sub">Đăng nhập quản trị viên</div>

        <div class="error-msg" role="alert">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>

<script>
// Stars
(function(){
  const c = document.getElementById('stars');
  for(let i = 0; i < 120; i++){
    const s = document.createElement('div');
    s.className = 'star';
    const sz = (Math.random()*2.2+0.4).toFixed(1);
    s.style.cssText =
      `left:${(Math.random()*100).toFixed(1)}%;top:${(Math.random()*88).toFixed(1)}%;` +
      `width:${sz}px;height:${sz}px;` +
      `--dur:${(Math.random()*3+2).toFixed(1)}s;--delay:${(Math.random()*5).toFixed(1)}s`;
    c.appendChild(s);
  }
})();

// Shooting stars
function shootingStar(){
  const el = document.createElement('div');
  const x = Math.random()*65+5, y = Math.random()*28+3, a = Math.random()*25+15;
  Object.assign(el.style,{
    position:'absolute',left:x+'%',top:y+'%',
    width:'90px',height:'1.5px',
    background:'linear-gradient(to right,rgba(255,255,255,.95),transparent)',
    transform:`rotate(${a}deg)`,opacity:'0',
    pointerEvents:'none',zIndex:'6',borderRadius:'1px',transition:'opacity .1s ease',
  });
  document.getElementById('scene').appendChild(el);
  requestAnimationFrame(()=>{
    el.style.opacity='1';
    el.style.transition='opacity .12s ease,transform .55s cubic-bezier(.2,0,.8,1)';
    el.style.transform=`rotate(${a}deg) translateX(130px)`;
    setTimeout(()=>{el.style.opacity='0';setTimeout(()=>el.remove(),600)},380);
  });
}
setInterval(()=>{
  if(document.body.classList.contains('night')&&Math.random()>.45) shootingStar();
},3800);

// Mode switch
function setMode(mode){
  const night = mode==='night';
  document.body.classList.toggle('night',night);
  document.getElementById('tab-login').classList.toggle('active',!night);
  document.getElementById('tab-register').classList.toggle('active',night);
  document.getElementById('tab-login').setAttribute('aria-selected',!night);
  document.getElementById('tab-register').setAttribute('aria-selected',night);
  document.getElementById('login-panel').style.display    = night ? 'none' : '';
  document.getElementById('register-panel').style.display = night ? '' : 'none';
}

// Password toggle
let _pwVis = false;
function togglePw(){
  _pwVis = !_pwVis;
  document.getElementById('password').type = _pwVis ? 'text' : 'password';
  document.getElementById('pw-icon').innerHTML = _pwVis
    ? '<path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>'
    : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
}

// Loading state
document.getElementById('login-form').addEventListener('submit',function(){
  const btn = document.getElementById('submit-btn');
  btn.classList.add('loading');
  btn.innerHTML = '<svg viewBox="0 0 24 24" style="animation:spin .75s linear infinite" stroke="white" stroke-width="2.2" stroke-linecap="round" fill="none"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg> Đang xác thực…';
});

// Restore error → switch to day tab automatically
{% if error %}setMode('day');{% endif %}
</script>

</body>
</html>
