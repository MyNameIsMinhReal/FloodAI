{% extends "base.html" %}
{% block title %}Tin mới{% endblock %}

{% block head %}
<style>
.news-header{margin-bottom:28px}
.news-header h1{font-family:var(--font-serif);font-size:26px;font-weight:700;margin-bottom:8px}
.news-header p{color:var(--tx2);font-size:15px}
.news-filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:22px}
.nf-btn{padding:5px 14px;border-radius:20px;border:1px solid var(--border);
  background:transparent;font-family:var(--font);font-size:12.5px;font-weight:500;
  color:var(--tx2);cursor:pointer;transition:all .15s}
.nf-btn:hover{background:var(--card);color:var(--tx)}
.nf-btn.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.news-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin-bottom:32px}
.load-more{display:block;margin:0 auto;padding:10px 28px}
</style>
{% endblock %}

{% block content %}
<div class="container">
<div class="news-header">
  <h1>Tin mới nhất</h1>
  <p>Cập nhật tình hình ngập lụt từ các nguồn ảnh hiện trường và tin tức.</p>
</div>

<div class="news-filters">
  <button class="nf-btn active" onclick="filterNews('all',this)">Tất cả</button>
  <button class="nf-btn" onclick="filterNews('high',this)">Nguy hiểm</button>
  <button class="nf-btn" onclick="filterNews('medium',this)">Cần chú ý</button>
  <button class="nf-btn" onclick="filterNews('low',this)">Nhẹ</button>
  <button class="nf-btn" onclick="filterNews('news',this)">Tin tức</button>
</div>

<div class="news-grid" id="news-grid">
  <div style="grid-column:1/-1;padding:32px;text-align:center;color:var(--tx3)">Đang tải...</div>
</div>
<button class="btn btn-outline load-more" id="load-more-btn" onclick="loadMore()" style="display:none">Tải thêm</button>
</div>
{% endblock %}

{% block scripts %}
<script>
const LEVEL_INFO={
  dry:{label:'Không ngập',sev:'ok',badge:'badge-ok'},
  ankle:{label:'Ngập nhẹ',sev:'low',badge:'badge-low'},
  knee:{label:'Ngập đầu gối',sev:'medium',badge:'badge-medium'},
  waist:{label:'Ngập nặng',sev:'high',badge:'badge-high'},
  chest:{label:'Rất nguy hiểm',sev:'critical',badge:'badge-critical'},
  submerged:{label:'Ngập hoàn toàn',sev:'critical',badge:'badge-critical'},
  unknown:{label:'Cần xác minh',sev:'unknown',badge:'badge-unknown'},
};
const RECS={dry:'Không ngập.',ankle:'Nhẹ, chú ý trơn trượt.',
  knee:'Hạn chế xe máy.',waist:'Không nên đi qua.',
  chest:'Nguy hiểm — tránh xa.',submerged:'Cực kỳ nguy hiểm.',unknown:'Chờ xác minh.'};
let allItems=[],page=0,PER=12;

async function loadAllNews(){
  const items=[];
  try{
    const r1=await fetch('/api/jobs?limit=50');
    const jobs=await r1.json();
    jobs.filter(j=>j.status==='done').forEach(j=>items.push({
      type:'ai',id:j.job_id,
      level:j.result?.level||'unknown',sev:j.result?.sev||'unknown',
      title:buildTitle(j.result?.level,j.result?.location),
      summary:RECS[j.result?.level||'unknown']||'',
      time:j.created_at,source:j.result?.source||'AI phân tích',
      depth:j.result?.depth_range||'',
    }));
  }catch{}
  try{
    const r2=await fetch('/api/news/fetch');
    const data=await r2.json();
    (data.articles||data||[]).forEach(a=>items.push({
      type:'news',id:a.url||a.id,
      level:'unknown',sev:'unknown',badge:'badge-unknown',
      title:a.title||'Tin tức',summary:a.summary||a.description||'',
      time:a.published_at||a.date,source:a.source||'Tin tức',
    }));
  }catch{}
  allItems=items;
  renderPage();
  if(items.length>PER)document.getElementById('load-more-btn').style.display='block';
}
function buildTitle(level,loc){
  const labels={dry:'Không ngập',ankle:'Ngập nhẹ',knee:'Ngập đầu gối',
    waist:'Ngập nặng',chest:'Nguy hiểm',submerged:'Ngập hoàn toàn',unknown:'Cập nhật'};
  return (labels[level]||'Cập nhật')+' tại '+(loc||'khu vực phân tích');
}
function renderPage(){
  const el=document.getElementById('news-grid');
  const show=allItems.slice(0,PER*(page+1));
  if(!show.length){el.innerHTML='<div style="grid-column:1/-1;padding:32px;text-align:center;color:var(--tx3)">Chưa có tin mới.</div>';return;}
  el.innerHTML=show.map(a=>{
    const info=LEVEL_INFO[a.level]||LEVEL_INFO.unknown;
    return `<a class="article-card sev-${info.sev}" href="/article/${a.id}">
      <div class="ac-body">
        <div class="ac-meta">
          <span class="badge ${info.badge}">${a.type==='news'?'Tin tức':info.label}</span>
          <span class="ac-time">${timeAgo(a.time)}</span>
        </div>
        <div class="ac-title">${a.title||'Cập nhật ngập lụt'}</div>
        <div class="ac-summary">${a.summary||''}</div>
        ${a.depth?`<div style="font-size:12px;color:var(--tx3);margin-top:6px">Ước tính: ${a.depth}</div>`:''}
      </div>
      <div class="ac-footer">
        <span>${a.source||'Hệ thống'}</span>
        <span class="ac-read">Đọc thêm →</span>
      </div>
    </a>`;
  }).join('');
}
function filterNews(type,btn){
  document.querySelectorAll('.nf-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  if(type==='all'){allItems.sort((a,b)=>new Date(b.time)-new Date(a.time));}
  else if(type==='news'){allItems.sort((a,b)=>(a.type==='news'?-1:1));}
  else{const O={critical:0,high:1,medium:2,low:3,ok:4,unknown:5};
    allItems.sort((a,b)=>(O[a.sev]||5)-(O[b.sev]||5));}
  page=0;renderPage();
}
function loadMore(){page++;renderPage();}
loadAllNews();
</script>
{% endblock %}
