[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "flood-pipeline"
version = "2.0.0"
description = "Flood image analysis pipeline — Depth Anything V2 + YOLOv8 + DINOv2"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

# ── Ruff (linter + formatter thay thế flake8/isort) ──────────────────────────
[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    ".git", "__pycache__", ".venv", "output", "models",
    "learning/models", "datasets",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (undefined names, unused imports)
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",  # line too long — ruff format handles this
    "B008",  # do not perform function calls in default args
    "UP007", # X | Y union syntax — Python 3.9 compat
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401", "F811"]  # unused imports OK in tests

# ── Black (formatter) ─────────────────────────────────────────────────────────
[tool.black]
line-length = 100
target-version = ["py310", "py311"]
exclude = '''
/(
  \.git
  | __pycache__
  | output
  | models
  | datasets
)/
'''

# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short -q"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning:torch",
]

# ── Coverage ──────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["pipeline", "utils", "depth_analysis", "learning"]
omit = ["*/tests/*", "*/output/*", "setup_env.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
